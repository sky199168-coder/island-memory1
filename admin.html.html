<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老師管理頁｜島嶼記憶史</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbf8ec;--card:#fff;--ink:#222;--sub:#6b6b6b;--line:#e4e0d6;--acc:#2f7d5b;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#2b2a26;--card:#2a2a28;--ink:#f0ede4;--sub:#a9a699;--line:#403e38;--acc:#6fcf9f;--bad:#e8806f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:20px;max-width:900px;margin-inline:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:14px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.artist{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.artist h3{margin:0 0 6px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row small{color:var(--sub)}
.row .d{color:var(--bad);border-color:var(--bad);padding:3px 10px;height:fit-content}
#msg{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<h1>老師管理頁</h1>
<div id="auth"><button id="login">用 Google 登入</button> <span id="msg"></span></div>
<div class="tabs" id="tabs" hidden></div>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyD4vyYtsLXhBZjUR0zpyBRttjpkNmmj5Mw",
  authDomain: "island-memory.firebaseapp.com",
  projectId: "island-memory",
  storageBucket: "island-memory.firebasestorage.app",
  messagingSenderId: "1070944643144",
  appId: "1:1070944643144:web:6d30b12236d9171ef7507d"
});
const db = getFirestore(app), auth = getAuth(app);
const CLASSES = ["401","402","403","404","405","406"];
const ARTISTS = ["石川欽一郎","木下靜涯","鄉原古統","鹽月桃甫","林玉山","陳進","郭雪湖","倪蔣懷","廖繼春","洪瑞麟","林之助","陳澄波","顏水龍","黃榮燦","溥心畬","黃君璧","張大千","劉國松","莊喆","夏陽","蕭勤","吳李玉哥","洪通","林淵"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cls = CLASSES[0], unsub = null, rows = [];

$("#login").onclick = async () => {
  if (auth.currentUser) return signOut(auth);
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e){ $("#msg").textContent = "登入失敗：" + e.code; }
};
onAuthStateChanged(auth, u => {
  $("#login").textContent = u ? "登出" : "用 Google 登入";
  $("#msg").textContent = u ? `已登入：${u.email}（只有設定在規則裡的信箱才能刪除）` : "";
  $("#tabs").hidden = !u;
  if (unsub) { unsub(); unsub = null; }
  $("#list").innerHTML = "";
  if (u) { drawTabs(); watch(); }
});

function drawTabs(){
  $("#tabs").innerHTML = CLASSES.map(c => `<button data-c="${c}" class="${c===cls?'on':''}">${c} 班</button>`).join("");
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; cls = b.dataset.c; drawTabs(); watch(); };

function watch(){
  if (unsub) unsub();
  unsub = onSnapshot(query(collection(db, "comments"), where("cls", "==", cls)), s => {
    rows = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.ts - b.ts);
    draw();
  });
}
function draw(){
  const total = rows.length;
  $("#list").innerHTML = `<p>${cls} 班：共 ${total} 則留言</p>` + ARTISTS.map(a => {
    const l = rows.filter(r => r.artist === a);
    return `<div class="artist"><h3>${esc(a)}　<small>${l.length}/2</small></h3>` +
      (l.length ? l.map(r => `<div class="row"><div><b>${esc(r.name)}</b> <small>${new Date(r.ts).toLocaleString("zh-TW")}</small><br>${esc(r.text)}</div><button class="d" data-id="${esc(r.id)}">刪除</button></div>`).join("") : `<small>尚無人認領</small>`) + `</div>`;
  }).join("");
}
$("#list").onclick = async e => {
  const b = e.target.closest(".d"); if (!b || !confirm("確定刪除這則留言？")) return;
  try { await deleteDoc(doc(db, "comments", b.dataset.id)); }
  catch(err){ alert("刪除失敗：此信箱沒有權限，請確認 Firestore 規則中的信箱。"); }
};
</script>
</body>
</html>
